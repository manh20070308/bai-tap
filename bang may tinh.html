<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Máy tính cơ bản</title>
</head>
<body>
    <h2>Máy tính cơ bản</h2>
    <input type="number" id="num1" placeholder="Số thứ nhất">
    <input type="number" id="num2" placeholder="Số thứ hai">
    <br><br>
    
    <button onclick="calculate('+')">Cộng (+)</button>
    <button onclick="calculate('-')">Trừ (-)</button>
    <button onclick="calculate('*')">Nhân (×)</button>
    <button onclick="calculate('/')">Chia (÷)</button>

    <h3>Kết quả: <span id="result">0</span></h3>

    <script>
        function calculate(operator) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultElement = document.getElementById('result');

            if (isNaN(num1) || isNaN(num2)) {
                resultElement.innerText = "Vui lòng nhập đủ 2 số!";
                return;
            }

            let result = 0;
            switch (operator) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    if (num2 === 0) {
                        resultElement.innerText = "Không thể chia cho 0!";
                        return;
                    }
                    result = num1 / num2;
                    break;
            }

            resultElement.innerText = result;
        }
    </script>
</body>
</html>
